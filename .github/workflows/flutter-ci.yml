name: Flutter CI

on:
  push:
    paths:
      - "app/**"
      - "content/**"
      - "scripts/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "content/**"
      - "scripts/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --project-name english_learning_legal_academy /tmp/linguapro_android_template
            cp -R /tmp/linguapro_android_template/android ./android
          fi
      - name: Add microphone permission for speech recognition
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if "android.permission.RECORD_AUDIO" not in content:
              marker = "<application"
              if marker not in content:
                  raise SystemExit("Android manifest is missing the application element")
              content = content.replace(marker, permission + "    " + marker, 1)
              manifest.write_text(content)
          PY
      - name: Verify packaged lessons match canonical content
        run: |
          cmp ../content/english/a1/lessons.json assets/lessons/english_a1.json
          cmp ../content/legal-english/lessons.json assets/lessons/legal_english.json
          cmp ../content/english/expansion/lessons.json assets/lessons/general_expansion.json
          cmp ../content/legal-english/expansion/lessons.json assets/lessons/legal_expansion.json
      - name: Validate lesson JSON before tests and build
        run: python ../scripts/validate_content.py --content-dir ../content
      - name: Test content validator
        run: python -m unittest discover -s ../scripts -p 'test_*.py' -v
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: linguapro-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: linguapro-android-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
