name: Flutter CI

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --project-name english_learning_legal_academy /tmp/linguapro_android_template
            cp -R /tmp/linguapro_android_template/android ./android
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release
